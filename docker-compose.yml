x-postgres-environment: &postgres-environment
  POSTGRES_DB: "${POSTGRES_DB:-capstone}"
  POSTGRES_USER: "${POSTGRES_USER:-capstone}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-capstone_dev_only}"

services:
  # =========================
  # Application PostgreSQL
  # =========================
  postgres:
    image: postgres:16-alpine
    environment: *postgres-environment
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================
  # Backend
  # =========================
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment:
      PORT: "${BACKEND_PORT:-3000}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173}"
      JWT_SECRET: "${JWT_SECRET:-local-development-secret-change-me-32chars}"
      JWT_EXPIRES_IN: "${JWT_EXPIRES_IN:-15m}"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: "${POSTGRES_DB:-capstone}"
      DATABASE_USER: "${POSTGRES_USER:-capstone}"
      DATABASE_PASSWORD: "${POSTGRES_PASSWORD:-capstone_dev_only}"
    ports:
      - "${BACKEND_HOST_PORT:-3000}:${BACKEND_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:${BACKEND_PORT:-3000}/health || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================
  # Frontend
  # =========================
  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:3000}"
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8080/ >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # =========================
  # SonarQube PostgreSQL
  # =========================
  sonarqube-db:
    profiles: ["quality"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # =========================
  # SonarQube
  # =========================
  sonarqube:
    profiles: ["quality"]
    image: sonarqube:community
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    restart: unless-stopped

volumes:
  postgres-data:

  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
