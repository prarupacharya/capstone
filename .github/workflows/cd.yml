name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend

concurrency:
  group: dora-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: dora

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build applications
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate backend image metadata
        id: backend-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Generate frontend image metadata
        id: frontend-metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        id: backend-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: ${{ steps.backend-metadata.outputs.tags }}
          labels: ${{ steps.backend-metadata.outputs.labels }}

      - name: Build and push frontend image
        id: frontend-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packages/frontend/Dockerfile
          push: true
          tags: ${{ steps.frontend-metadata.outputs.tags }}
          labels: ${{ steps.frontend-metadata.outputs.labels }}

      - name: Package release outputs
        run: |
          mkdir -p release/backend release/frontend
          cp -R packages/backend/dist release/backend/dist
          cp -R packages/frontend/dist release/frontend/dist

      - name: Write deployment metadata
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          PR_REF: ${{ github.event.pull_request.html_url || '' }}
          RUN_ID: ${{ github.run_id }}
          STARTED_AT: ${{ github.run_started_at }}
          OUTCOME: ${{ job.status }}
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend-image.outputs.digest }}
        run: |
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          cat > release/deployment-record.json <<EOF
          {
            "environment": "dora",
            "commit_sha": "${COMMIT_SHA}",
            "ref": "${REF_NAME}",
            "pull_request": "${PR_REF}",
            "run_id": "${RUN_ID}",
            "started_at": "${STARTED_AT}",
            "completed_at": "${completed_at}",
            "outcome": "${OUTCOME}",
            "backend_image": "${BACKEND_IMAGE}",
            "backend_digest": "${BACKEND_DIGEST}",
            "frontend_image": "${FRONTEND_IMAGE}",
            "frontend_digest": "${FRONTEND_DIGEST}"
          }
          EOF

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: capstone-${{ github.sha }}-${{ github.run_id }}
          path: release
          if-no-files-found: error
          retention-days: 30
